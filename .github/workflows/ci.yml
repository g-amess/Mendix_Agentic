name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Doctor (JSON)
        # mxcli and Claude Code are not installed in CI; doctor must still
        # report cleanly. We tolerate a non-zero exit if the only FAIL is a
        # missing optional dependency — in phase 1, missing mxcli is WARN,
        # missing Claude is WARN, so exit should be 0.
        shell: bash
        run: |
          python bin/doctor.py --json

      - name: Unit tests
        shell: bash
        run: |
          python -m unittest discover tests -v
